[package]
name = "agentgateway-app"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "agentgateway"
path = "src/main.rs"
bench = false

[[bin]]
name = "ai-llm-gateway"
path = "src/bin/ai-llm-gateway.rs"
bench = false
required-features = ["gateway-llm"]

[[bin]]
name = "ai-llm-routing-gateway"
path = "src/bin/ai-llm-routing-gateway.rs"
bench = false
required-features = ["gateway-llm", "inference-routing"]

[[bin]]
name = "ai-agent-gateway"
path = "src/bin/ai-agent-gateway.rs"
bench = false
required-features = ["gateway-llm", "gateway-a2a"]

[[bin]]
name = "ai-full-gateway"
path = "src/bin/ai-full-gateway.rs"
bench = false
required-features = ["gateway-llm", "gateway-a2a", "gateway-mcp"]

[features]
# Jemalloc has been found to have the highest throughput and best ability to return memory to the system
# This comes at the small cost of a few mb memory overhead relative to others (most notable in an empty setup).
default = [
	"gateway-full",
	"runtime-base",
	"jemalloc",
	"mimalloc",
	"tls-aws-lc",
]
runtime-base = ["agentgateway/runtime-base"]
gateway-llm = ["agentgateway/gateway-llm"]
gateway-a2a = ["agentgateway/gateway-a2a"]
gateway-mcp = ["agentgateway/gateway-mcp"]
inference-routing = ["agentgateway/inference-routing", "gateway-llm"]
security-s1 = ["agentgateway/security-s1"]
gateway-rag = ["agentgateway/gateway-rag"]
ui = ["agentgateway/ui"]
gateway-full = [
	"gateway-llm",
	"gateway-a2a",
	"gateway-mcp",
	"inference-routing",
	"security-s1",
	"gateway-rag",
]
jemalloc = ["dep:tikv-jemallocator", "agentgateway/jemalloc"]
mimalloc = ["dep:mimalloc", "agentgateway/mimalloc"]
# TLS crypto provider passthroughs. A provider must be selected; `tls-aws-lc` is the default.
# Builds that pass `--no-default-features` (e.g. arm64 musl, which drops jemalloc) MUST re-add one
# of these, otherwise the agentgateway TLS code will fail to compile.
tls-aws-lc = ["agentgateway/tls-aws-lc"]
tls-openssl = ["agentgateway/tls-openssl"]
providers-aws = ["agentgateway/providers-aws"]
providers-azure = ["agentgateway/providers-azure"]
providers-gcp = ["agentgateway/providers-gcp"]
database = ["agentgateway/database"]
telemetry-otlp = ["agentgateway/telemetry-otlp"]
schema = ["agentgateway/schema"]

[dependencies]
pprof-alloc.workspace = true
agent-core.workspace = true
agentgateway = { path = "../agentgateway", default-features = false }
anyhow.workspace = true
clap.workspace = true
fs-err = { workspace = true, features = ["tokio"] }
libc.workspace = true
mimalloc = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[lints.clippy]
# This rule makes code more confusing
assigning_clones = "allow"
# This doesn't understand `strng` which we use everywhere
borrow_interior_mutable_const = "allow"
declare_interior_mutable_const = "allow"
