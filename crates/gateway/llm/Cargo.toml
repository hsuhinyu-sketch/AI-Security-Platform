[package]
name = "gateway-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["protocol"]
# Shared configuration/observation/pricing values remain available without protocol code.
protocol = ["dep:gateway-protocol-core", "dep:async-openai", "dep:base64", "dep:http", "dep:http-body", "dep:itertools", "dep:pin-project-lite", "dep:percent-encoding", "dep:rand", "dep:tokio_sse_codec", "dep:tokio-util", "dep:tracing"]
schema = ["dep:schemars"]

[dependencies]
gateway-protocol-core = { path = "../protocol-core", optional = true }
anyhow.workspace = true
arcstr.workspace = true
async-trait.workspace = true
async-openai = { workspace = true, features = ["chat-completion-types", "response-types"], optional = true }
bytes.workspace = true
base64 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
rand = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
tokio_sse_codec = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
futures-util.workspace = true
http-body-util.workspace = true
tokio.workspace = true
