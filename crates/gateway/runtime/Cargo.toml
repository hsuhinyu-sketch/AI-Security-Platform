shellexpand.workspace = true
socket2.workspace = true
sse-stream.workspace = true
subtle.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tiktoken-rs = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tokio_sse_codec.workspace = true
tonic.workspace = true
tower-http.workspace = true
tower-serve-static.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
typespec_client_core = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true
x509-parser.workspace = true
reqwest.workspace = true
websocket-sans-io.workspace = true
vector-map.workspace = true
flagset.workspace = true

# Linux only dependencies
[target.'cfg(target_family = "unix")'.dependencies]
pprof.workspace = true

# Windows only dependencies
[target.'cfg(target_family = "windows")'.dependencies]
which.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { workspace = true, features = ["taskdump"] }
tikv-jemallocator = { workspace = true, optional = true }
jemalloc_pprof = { workspace = true, optional = true }

[target.'cfg(all(target_os = "linux", not(all(target_env = "musl", target_arch = "aarch64"))))'.dependencies]
pprof-alloc = { workspace = true, features = ["allocator-jemalloc"] }

[target.'cfg(all(target_os = "linux", target_env = "musl", target_arch = "aarch64"))'.dependencies]
pprof-alloc.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
pprof-alloc.workspace = true
tokio = { workspace = true }

[lints.clippy]
# This rule makes code more confusing
assigning_clones = "allow"
# This doesn't understand `strng` which we use everywhere
borrow_interior_mutable_const = "allow"
declare_interior_mutable_const = "allow"

[lints.rust]
# This rule makes code more confusing
mismatched_lifetime_syntaxes = "allow"
# ossl350 is set by the openssl-sys crate when OpenSSL >= 3.5.0 is detected.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ossl350)'] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
