[package]
name = "ai-security-platform-runtime"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }

[lib]
path = "src/lib.rs"

[features]
default = [
	"gateway-full",
	"runtime-base",
	"security-a2a-sqlite",
	"jemalloc",
	"mimalloc",
	"tls-aws-lc",
]
# LLM-only edge composition. Choose one TLS feature explicitly with --no-default-features.
llm-edge = ["gateway-llm", "security-s1", "database", "telemetry-otlp"]
mcp-edge = ["gateway-mcp", "security-s1", "database", "telemetry-otlp"]
runtime-base = [
	"providers-aws",
	"providers-azure",
	"providers-gcp",
	"database",
	"telemetry-otlp",
]
gateway-llm = ["gateway-composition/gateway-llm", "dep:tiktoken-rs", "gateway-llm/protocol", "dep:async-openai"]
gateway-a2a = ["gateway-composition/gateway-a2a", "dep:gateway-a2a"]
gateway-mcp = ["gateway-composition/gateway-mcp", "dep:gateway-mcp", "dep:rmcp"]
inference-routing = ["gateway-composition/inference-routing", "gateway-llm"]
security-s1 = ["gateway-composition/security-s1"]
gateway-rag = ["gateway-composition/gateway-rag", "dep:gateway-rag", "dep:security-rag"]
gateway-full = [
	"gateway-llm",
	"gateway-a2a",
	"gateway-mcp",
	"inference-routing",
	"security-s1",
	"gateway-rag",
]
jemalloc = ["dep:tikv-jemallocator", "dep:jemalloc_pprof"]
mimalloc = ["pprof-alloc/allocator-mimalloc", "dep:mimalloc"]
tls-aws-lc = ["rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs"]
tls-openssl = ["dep:openssl", "dep:rustls-openssl"]
# Cloud provider SDKs. Disable when not needed to reduce compile time and binary size.
providers-aws = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws-types",
    "dep:aws-smithy-eventstream",
    "dep:aws-smithy-types",
]
providers-azure = ["dep:azure_core", "dep:azure_identity", "dep:typespec_client_core"]
providers-gcp = ["dep:google-cloud-auth"]
# Request log persistence (SQLite/PostgreSQL).
database = ["dep:sqlx"]
# Durable A2A ownership metadata, independent of request log persistence.
security-a2a-sqlite = ["security-integration-runtime/a2a-sqlite"]
# OpenTelemetry trace/log export.
telemetry-otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-http",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-proto",
    "dep:opentelemetry_sdk",
]
ui = []
schema = ["schemars", "gateway-llm/schema"]
assert_size_runtime = ["platform-core/assert_size_runtime"]

[dependencies]
gateway-contracts = { path = "../contracts" }
gateway-llm = { path = "../llm", default-features = false }
gateway-protocol-core = { path = "../protocol-core" }
gateway-mcp = { path = "../mcp", optional = true, features = ["openapi"] }
gateway-a2a = { path = "../a2a", optional = true }
platform-core.workspace = true
platform-celx.workspace = true
platform-hbone.workspace = true
platform-pool.workspace = true
gateway-composition = { path = "../composition", default-features = false }
gateway-rag = { path = "../rag", optional = true }
security-pipeline = { path = "../../security/pipeline" }
security-audit = { path = "../../security/audit" }
security-rag = { path = "../../security/rag", optional = true }
security-integration-runtime = { path = "../../security/integration-runtime" }
security-capability-broker = { path = "../../security/capability-broker" }
security-types = { path = "../../security/types" }
anyhow.workspace = true
arc-swap.workspace = true
async-compression.workspace = true
async-openai = { workspace = true, optional = true, features = ["chat-completion-types", "moderation-types", "response-types", "realtime-types"] }
async-trait.workspace = true
atomic_float.workspace = true
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }
aws-lc-rs.workspace = true
openssl = { workspace = true, optional = true }
rustls-openssl = { workspace = true, optional = true }
aws-smithy-eventstream = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
axum-core.workspace = true
axum-extra.workspace = true
axum.workspace = true
azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
cookie.workspace = true
cel.workspace = true
chrono.workspace = true
clocksource.workspace = true
core_affinity.workspace = true
crossbeam.workspace = true
frozen-collections.workspace = true
fs-err = { workspace = true }
futures-core.workspace = true
futures-util.workspace = true
futures.workspace = true
google-cloud-auth = { workspace = true, optional = true }
hashbrown.workspace = true
headers.workspace = true
heck.workspace = true
hex.workspace = true
hickory-resolver.workspace = true
htpasswd-verify-fork.workspace = true
http-body-util.workspace = true
http-body.workspace = true
http-serde.workspace = true
http.workspace = true
httpdate.workspace = true
hyper-util.workspace = true
hyper.workspace = true
include_dir.workspace = true
indexmap = { workspace = true }
ipnet.workspace = true
itertools.workspace = true
jsonwebtoken.workspace = true
lazy_static.workspace = true
macro_rules_attribute.workspace = true
notify-debouncer-full.workspace = true
notify.workspace = true
num_cpus.workspace = true
once_cell.workspace = true
multer.workspace = true
openapiv3.workspace = true
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
parking_lot.workspace = true
pem.workspace = true
percent-encoding.workspace = true
phonenumber.workspace = true
pin-project-lite.workspace = true
ppp.workspace = true
prometheus-client.workspace = true
platform-protos.workspace = true
prost-types.workspace = true
prost-wkt-types.workspace = true
prost.workspace = true
rand.workspace = true
quick_cache.workspace = true
libc.workspace = true
