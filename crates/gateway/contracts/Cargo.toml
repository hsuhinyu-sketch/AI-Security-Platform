[package]
name = "gateway-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The workspace Tokio declaration enables `full`; contracts need only watch.
tokio = { version = "1.52", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.52", default-features = false, features = ["sync", "macros", "rt-multi-thread", "time"] }
