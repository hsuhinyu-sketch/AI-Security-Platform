[package]
name = "security-integration-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
pii = ["dep:security-pii"]
a2a-sqlite = ["dep:sqlx"]

[dependencies]
security-pii = { path = "../pii", optional = true }
security-audit = { path = "../audit" }
security-pipeline = { path = "../pipeline" }
security-types = { path = "../types" }
serde.workspace = true
serde_json.workspace = true
serde_json_path_to_error.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
sqlx = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
security-rag = { path = "../rag" }
libc.workspace = true
