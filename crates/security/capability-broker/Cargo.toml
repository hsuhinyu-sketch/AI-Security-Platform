[package]
name = "security-capability-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[example]]
name = "protected_ticket_tool"
required-features = ["client"]

[features]
client = ["dep:base64", "dep:reqwest", "dep:sha2", "dep:subtle"]

[dependencies]
axum.workspace = true
base64 = { workspace = true, optional = true }
chrono.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"], optional = true }
serde.workspace = true
serde_json.workspace = true
security-types = { path = "../types" }
security-audit = { path = "../audit" }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true
