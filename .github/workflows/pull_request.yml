name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test -p security-policy -p security-engine -p security-audit -p security-pipeline -p security-integration-runtime -p security-capability-broker -p security-rag -p gateway-rag -p gateway-composition
      - run: cargo test -p ai-security-platform-runtime --lib ai_system_rejects_tool_approval_without_mcp_gateway
      - run: cargo test -p ai-security-platform-runtime --lib tls_termination
